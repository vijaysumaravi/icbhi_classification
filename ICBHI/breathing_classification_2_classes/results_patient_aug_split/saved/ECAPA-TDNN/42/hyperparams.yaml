# Generated 2025-01-12 from:
# /u/project/halperin/voicesafe/spapl/vijay/speechbrain/speechbrain/recipes/ICBHI/breathing_classification_2_classes/hparams/train_patients_aug.yaml
# yamllint disable
# ########################################
# Breathing Sound Classification using simple ECAPA-TDNN
#
#  * Authors: Vijay Ravi 2025
# ########################################

# Seed needs to be set at top of yaml, before objects with parameters are made
seed: 42
__set_seed: !apply:speechbrain.utils.seed_everything [42]

# Dataset needs to be downloaded from https://bhichallenge.med.auth.gr/. Save audio and annotations in separate folders.
data_folder: /u/home/s/spaceman/project-voicesafe/spapl/vijay/speechbrain/cough_audio/icbi/  # e.g., /path/to/ICBHI
audio_dir: 
  /u/home/s/spaceman/project-voicesafe/spapl/vijay/speechbrain/cough_audio/icbi//audio_data
annotation_dir: 
  /u/home/s/spaceman/project-voicesafe/spapl/vijay/speechbrain/cough_audio/icbi//annotation_data
output_folder: results_patient_aug_split/ECAPA-TDNN/42
save_folder: results_patient_aug_split/ECAPA-TDNN/42/save
train_log: results_patient_aug_split/ECAPA-TDNN/42/train_log.txt
num_workers: 4


# Path where data manifest files will be stored
train_annotation: results_patient_aug_split/ECAPA-TDNN/42/train.json
valid_annotation: results_patient_aug_split/ECAPA-TDNN/42/valid.json
test_annotation: results_patient_aug_split/ECAPA-TDNN/42/test.json
split_type: random
split_variable: patient
# split_type: "random" needs split_ratio
split_ratio: [0.6, 0.2, 0.2]
skip_prep: false





# The train logger writes training statistics to a file, as well as stdout.
train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
  save_file: results_patient_aug_split/ECAPA-TDNN/42/train_log.txt

error_stats: !name:speechbrain.utils.metric_stats.MetricStats
  metric: !name:speechbrain.nnet.losses.classification_error
    reduction: batch

ckpt_interval_minutes: 15 # save checkpoint every N min

# Training Parameters
number_of_epochs: 100
batch_size: 64
gradient_accumulation_steps: 2
lr: 0.0001
weight_decay: 0.0001
base_lr: 0.00001
max_lr: 0.0001
step_size: 160  # 4 times number of iterations/epoch
mode: triangular2 # mode of learning rate schedule (triangular, triangular2, exp_range)
gamma: 0.9998  # divides learning rate by 3 over the first 20 epochs
sample_rate: 44100
shuffle: true
# random_chunk: True
drop_last: false

# Feature parameters

audio_processing_options:
  chunk_windows_seconds: 7   # in seconds
  overlap: 0.5   # as percentage (0.0 to 1.0)

n_mels: 128
n_fft: 2048
left_frames: 5
right_frames: 5
deltas: true
win_length: 46 #
hop_length: 12

# Number of classes
out_n_neurons: 2 # (normal, abnormal)

############################## Augmentations ###################################

# Data for augmentation
data_folder_noise: 
  /u/home/s/spaceman/project-voicesafe/spapl/vijay/speechbrain/cough_audio/icbi//noise # The noisy sequences for data augmentation will automatically be downloaded here.
NOISE_DATASET_URL: 
  https://www.dropbox.com/scl/fi/a09pj97s5ifan81dqhi4n/noises.zip?rlkey=j8b0n9kdjdr32o1f06t0cw5b7&dl=1
noise_annotation: results_patient_aug_split/ECAPA-TDNN/42/save/noise.csv #The data manifest files are created by the data preparation script


# Download and prepare the dataset of noisy sequences for augmentation
prepare_noise_data: !name:speechbrain.augment.preparation.prepare_dataset_from_URL
  URL: 
    https://www.dropbox.com/scl/fi/a09pj97s5ifan81dqhi4n/noises.zip?rlkey=j8b0n9kdjdr32o1f06t0cw5b7&dl=1
  dest_folder: 
    /u/home/s/spaceman/project-voicesafe/spapl/vijay/speechbrain/cough_audio/icbi//noise
  ext: wav
  csv_file: results_patient_aug_split/ECAPA-TDNN/42/save/noise.csv

# Add noise to input signal
add_noise: &id001 !new:speechbrain.augment.time_domain.AddNoise
  csv_file: results_patient_aug_split/ECAPA-TDNN/42/save/noise.csv
  snr_low: 5
  snr_high: 20
  noise_sample_rate: 16000
  clean_sample_rate: 44100
  num_workers: 4

# Speed perturbation
speed_perturb: &id002 !new:speechbrain.augment.time_domain.SpeedPerturb
  orig_freq: 44100
  speeds: [95, 100, 105]

# Frequency drop: randomly drops a number of frequency bands to zero.
drop_freq: &id003 !new:speechbrain.augment.time_domain.DropFreq
  drop_freq_low: 0
  drop_freq_high: 1
  drop_freq_count_low: 1
  drop_freq_count_high: 3
  drop_freq_width: 0.05

# Time drop: randomly drops a number of temporal chunks.
drop_chunk: &id004 !new:speechbrain.augment.time_domain.DropChunk
  drop_length_low: 1000
  drop_length_high: 2000
  drop_count_low: 1
  drop_count_high: 5

# Augmenter: Combines previously defined augmentations to perform data augmentation
wav_augment: !new:speechbrain.augment.augmenter.Augmenter
  concat_original: true
  min_augmentations: 1
  max_augmentations: 4
  augment_prob: 0.5
  augmentations: [*id001, *id002, *id003, *id004]


dataloader_options:
  batch_size: 64
  shuffle: true
  num_workers: 4
  drop_last: false

# Functions
compute_features: &id005 !new:speechbrain.lobes.features.Fbank
  n_mels: 128
  n_fft: 2048
  left_frames: 5
  right_frames: 5
  deltas: true
  sample_rate: 44100
  win_length: 46
  hop_length: 12

embedding_model: &id006 !new:speechbrain.lobes.models.ECAPA_TDNN.ECAPA_TDNN
  input_size: !apply:operator.mul [128, 3]              # n_mels * 3 for features + deltas + double-delta for time
  channels: [256, 256, 512]
  kernel_sizes: [5, 3, 1]
  dilations: [1, 2, 1]
  attention_channels: 32
  lin_neurons: 64
  dropout: 0.5    # Add dropout with 50% rate

classifier: &id007 !new:speechbrain.lobes.models.ECAPA_TDNN.Classifier
  input_size: 64
  out_neurons: 2

epoch_counter: &id009 !new:speechbrain.utils.epoch_loop.EpochCounter
  limit: 100

mean_var_norm: &id008 !new:speechbrain.processing.features.InputNormalization

  norm_type: sentence
  std_norm: false

modules:
  compute_features: *id005
  embedding_model: *id006
  classifier: *id007
  mean_var_norm: *id008
compute_cost: !new:speechbrain.nnet.losses.LogSoftmaxWrapper
  loss_fn: !new:speechbrain.nnet.losses.AdditiveAngularMargin
    margin: 0.2
    scale: 30

# compute_error: !name:speechbrain.nnet.losses.classification_error

opt_class: !name:torch.optim.Adam
  lr: 0.0001
  weight_decay: 0.0001

lr_annealing: !new:speechbrain.nnet.schedulers.CyclicLRScheduler
  mode: triangular2
  gamma: 0.9998
  base_lr: 0.00001
  max_lr: 0.0001
  step_size: 160

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
  checkpoints_dir: results_patient_aug_split/ECAPA-TDNN/42/save
  recoverables:
    embedding_model: *id006
    classifier: *id007
    normalizer: *id008
    counter: *id009
